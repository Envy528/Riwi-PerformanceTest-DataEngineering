[project]
name = "datamart"
version = "0.1.0"
description = "DataMart ETL pipeline orchestrated with Airflow"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pandas==3.0.5",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "psycopg2-binary>=2.9.13",
]
